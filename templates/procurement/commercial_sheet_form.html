{% extends "base.html" %}
{% block content %}
<h3>Nueva hoja comercial interna — {{ package.name }}</h3>
<p class="text-muted">Confidencial — nunca visible al cliente.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Crear hoja comercial</button>
    <a class="btn btn-outline-secondary" href="{% url 'procurement:package-detail' package.pk %}">Cancelar</a>
</form>
{% endblock %}
