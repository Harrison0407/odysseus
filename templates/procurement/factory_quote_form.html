{% extends "base.html" %}
{% block content %}
<h3>Registrar cotización de fábrica — {{ package.name }}</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Registrar</button>
    <a class="btn btn-outline-secondary" href="{% url 'procurement:package-detail' package.pk %}">Cancelar</a>
</form>
{% endblock %}
